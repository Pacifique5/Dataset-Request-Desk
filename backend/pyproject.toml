[project]
name = "dataset-request-desk-api"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["UP017"]  # keep timezone.utc for Python 3.10 compatibility

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert and throwaway credentials.
"tests/**" = ["S101", "S105", "S106"]
